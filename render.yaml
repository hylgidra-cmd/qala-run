# Render blueprint for the QalaRun web demo.
#
# Deploys the whole stack: PostGIS, Redis, the FastAPI backend and the static
# frontend. Migrations run before every deploy through preDeployCommand.
#
# Everything is on Render's free tier, which has two consequences for a demo:
# a free database is removed after 30 days, and a free web service sleeps
# after 15 minutes idle, so the first request afterwards takes about a
# minute. Move the database and the API to a paid plan before relying on it.
#
# The database needs the PostGIS extension, which migration 0001 creates.
databases:
  - name: qalarun-db
    databaseName: qrun
    user: qrun
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: qalarun-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: qalarun-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qalarun-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: qalarun-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The static site is a different origin, so it has to be allowed here.
      - key: CORS_ORIGINS
        value: https://qalarun-web.onrender.com,https://hylgidra-cmd.github.io

  - type: web
    name: qalarun-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/positron
      # Absolute, because there is no dev-server proxy in a static build.
      - key: VITE_API_URL
        value: https://qalarun-api.onrender.com/api/v1
    routes:
      # Single-page app: unknown paths must still load index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
