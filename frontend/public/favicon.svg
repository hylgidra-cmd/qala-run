<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#07130f"/>
  <!-- textLength pins the width so the mark stays identical whatever font resolves. -->
  <text x="32" y="33" fill="#c7ff4a"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1"
        textLength="38" lengthAdjust="spacingAndGlyphs"
        text-anchor="middle" dominant-baseline="central">DS</text>
</svg>
