name: Android app

# The native Kotlin app in android/. The Capacitor shell has its own workflow
# (build-apk.yml) and keeps shipping until this app replaces it.

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Also checks that gradle-wrapper.jar is a genuine Gradle wrapper.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dontstop-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: android/app/build/reports
